name: Generate Contribution Snake
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: NazarenoJoelEspinosa
          outputs: |
            dist/github-snake.svg?color_snake=%234F46E5&color_dots=%23EEF2FF,%23C7D2FE,%2393C5FD,%238B5CF6,%236D28D9
            dist/github-snake-dark.svg?color_snake=%23C4B5FD&color_dots=%23111827,%23312E81,%231D4ED8,%237C3AED,%23A78BFA
      - name: Publish
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
